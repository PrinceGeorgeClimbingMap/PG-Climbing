<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climbing Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <b id="site-title"></b>
    <div id="filters">
      <span id="types"></span>
      <label>Rope grade <select id="rmin"></select> to <select id="rmax"></select></label>
      <label>Boulder <select id="bmin"></select> to <select id="bmax"></select></label>
      <label><input type="text" id="q" placeholder="Search route name"></label>
    </div>
    <label><input type="checkbox" id="parking-toggle" checked>Parking</label>
    <button id="reset" type="button">Reset</button>
  </header>

  <div id="wrap">
    <div id="map"><div id="legend"></div></div>
    <aside id="panel"></aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
